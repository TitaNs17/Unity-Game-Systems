name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository structure
        run: python tools/validate_repository.py

  core-logic-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build core logic smoke tests
        run: dotnet build tests/CoreLogicSmoke/CoreLogicSmoke.csproj --configuration Release

      - name: Run core logic smoke tests
        run: dotnet run --project tests/CoreLogicSmoke/CoreLogicSmoke.csproj --configuration Release --no-build
